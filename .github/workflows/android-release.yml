name: Android signed release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'android/**'
      - 'mobile/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  VITE_API_BASE_URL: https://magisteria-production.up.railway.app

jobs:
  signed-aab:
    runs-on: ubuntu-24.04
    environment: google-play
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm cap:sync:android
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magisteria-upload.jks"
      - name: Build signed Android App Bundle
        shell: bash
        env:
          MAGISTERIA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/magisteria-upload.jks
          MAGISTERIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAGISTERIA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAGISTERIA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MAGISTERIA_ANDROID_KEYSTORE_PASSWORD"
          test -n "$MAGISTERIA_ANDROID_KEY_ALIAS"
          test -n "$MAGISTERIA_ANDROID_KEY_PASSWORD"
          chmod +x android/gradlew
          ./android/gradlew -p android clean bundleRelease
          test -f android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -strict android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > android/app/build/outputs/bundle/release/app-release.aab.sha256
      - name: Publish signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: magisteria-android-v0.9.0-build900
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
